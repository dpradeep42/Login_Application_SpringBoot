# Local and test profile. Activate with --spring.profiles.active=h2.
# The default profile still uses SQL Server through DB_URL, DB_USERNAME, and DB_PASSWORD.
spring.datasource.url=jdbc:h2:mem:credentials;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
